name: Deploy site

on:
  push:
    branches: [main]
    paths-ignore:
      - "infra/**"
      - ".github/workflows/infra-deploy.yml"

permissions:
  id-token: write
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::255572710732:role/github-actions-app-deploy
          # Matches where the S3 bucket actually lives (PortfolioStack,
          # eu-central-2) — CloudFront invalidation itself isn't
          # region-sensitive, but the S3 sync needs the right one.
          aws-region: eu-central-2

      - name: Sync to S3
        run: aws s3 sync dist/ "s3://leimgruber.dev" --delete

      - name: Invalidate CloudFront cache
        run: |
          aws cloudfront create-invalidation \
            --distribution-id "${{ vars.CLOUDFRONT_DISTRIBUTION_ID }}" \
            --paths "/*"

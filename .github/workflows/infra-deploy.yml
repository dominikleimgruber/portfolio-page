name: Deploy infra

on:
  push:
    branches: [main]
    paths:
      - "infra/**"
      - ".github/workflows/infra-deploy.yml"

permissions:
  id-token: write
  contents: read

concurrency:
  group: deploy-infra
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    # Explicit, not inferred from whatever the runner's credentials resolve
    # to — this is the one place the target AWS account is defined.
    env:
      CDK_DEPLOY_ACCOUNT: ${{ vars.AWS_ACCOUNT_ID }}
    defaults:
      run:
        working-directory: infra
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: infra/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npm run build

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_INFRA_ROLE_ARN }}
          # CDK CLI needs a region to talk to STS/CloudFormation with; the
          # stack itself is pinned to us-east-1 in bin/infra.ts regardless
          # (CloudFront's certificate requirement, not a deploy choice).
          aws-region: us-east-1

      - name: Deploy stack
        run: npx cdk deploy --require-approval never

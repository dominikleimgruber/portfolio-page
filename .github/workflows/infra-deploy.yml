name: Deploy infra

on:
  push:
    branches: [main]
    paths:
      - "infra/**"
      - ".github/workflows/infra-deploy.yml"

permissions:
  id-token: write
  contents: read

concurrency:
  group: deploy-infra
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    # Explicit, not inferred from whatever the runner's credentials resolve
    # to — this is the one place the target AWS account is defined. Not a
    # secret: account IDs aren't sensitive on their own (see role trust
    # policy for what actually restricts access).
    env:
      CDK_DEPLOY_ACCOUNT: "255572710732"
      # A secret, not a repo variable, since this repo is public and vars
      # are world-readable — an email address doesn't belong there.
      BUDGET_ALERT_EMAIL: ${{ secrets.BUDGET_ALERT_EMAIL }}
    defaults:
      run:
        working-directory: infra
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: infra/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npm run build

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::255572710732:role/github-actions-infra-deploy
          # This is just the region the CLI talks to STS/CloudFormation
          # through — the app deploys two stacks to two fixed regions of
          # their own regardless (GlobalStack: us-east-1, PortfolioStack:
          # eu-central-2 — see bin/infra.ts).
          aws-region: us-east-1

      - name: Deploy stacks
        run: npx cdk deploy --all --require-approval never
